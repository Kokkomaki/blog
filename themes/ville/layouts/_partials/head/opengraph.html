<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}ville kokkomäki{{ else }}{{ .Title }}{{ end }}">
{{- $ogDescription := "" }}
{{- if .Description }}{{ $ogDescription = .Description }}
{{- else if not .IsHome }}{{ $ogDescription = .Summary | plainify | truncate 200 }}
{{- end }}
{{- if $ogDescription }}
<meta property="og:description" content="{{ $ogDescription }}">
{{- end }}
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
{{- $img := partial "share-image.html" . }}
<meta property="og:image" content="{{ $img.url }}">
{{- if $img.width }}
<meta property="og:image:width" content="{{ $img.width }}">
<meta property="og:image:height" content="{{ $img.height }}">
{{- end }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ $img.url }}">
