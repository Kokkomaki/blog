baseURL = 'https://www.kokkomaki.com/'
locale = 'en-us'
title = 'Ville Kokkomäki'
theme = "ville"
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

# English stays at the root, so no existing URL changes. Finnish exists only
# as per-post translations under /fi/ (switcher in layouts/_default/single.html);
# it has no home, section, tag or feed pages of its own. Its sitemap stays on,
# since the root sitemap index points to it and carries the hreflang links.
[languages]
  [languages.en]
    weight = 1
  [languages.fi]
    weight = 2
    disableKinds = ['home', 'section', 'taxonomy', 'term', 'rss']

# static/images is also an asset folder, so share previews (layouts/_partials/share-image.html)
# can be resized at build time. Setting any mount drops Hugo's defaults, so they're restated.
[module]
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'

[params]
  author = "Ville Kokkomäki"
  email = "ville.kokkomaki@protonmail.com"
  paywallApiBase = "https://paywall.kokkomaki.com"
  description = "I write about Bitcoin, peace, vipassana, and all that good stuff."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Enable user to embed HTML snippets in Markdown content.
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    tabWidth = 4
    style = "algol_nu"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']
  expiryDate = ['expiryDate']
  lastmod = [':git', 'lastmod', 'date', 'publishDate']
  publishDate = ['publishDate', 'date']

[caches]
  [caches.images]
    dir = ':cacheDir/images'
