name: Build and deploy
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.97.3
      GO_VERSION: 1.25.6
      HUGO_VERSION: 0.169.0
      NODE_VERSION: 24.13.0
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Screenshot work page sites
        run: npm run screenshot-work
      - name: Configure Git
        run: |
          git config core.quotepath false
      - name: Gate (build, page checks, URL continuity, phone layout)
        run: npm run check:all
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Index with Pagefind
        run: npx pagefind@latest --site=public
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    name: Live smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Live pages load and their share images are real images under 300 KB
        run: |
          set -euo pipefail
          base="https://kokkomaki.com"
          ua='WhatsApp/2.23.20.0 A'
          check_page() {
            local url="$1" html img type size
            html=$(curl -fsSL --retry 3 --retry-delay 5 -A "$ua" "$url")
            img=$(printf '%s' "$html" | grep -oE 'property="?og:image"? content="?[^" >]+' | head -1 | sed -E 's/.*content="?//')
            [ -n "$img" ] || { echo "no og:image on $url"; exit 1; }
            read -r type size < <(curl -fsSL --retry 3 --retry-delay 5 -A "$ua" -o /dev/null -w '%{content_type} %{size_download}\n' "$img")
            case "$type" in image/*) ;; *) echo "og:image of $url is $type: $img"; exit 1 ;; esac
            if [ "$size" -lt 1000 ] || [ "$size" -ge 307200 ]; then echo "og:image of $url is $size bytes: $img"; exit 1; fi
            echo "ok $url -> $img ($type, $size bytes)"
          }
          check_page "$base/"
          check_page "$base/now/"
          newest=$(curl -fsSL --retry 3 "$base/index.xml" | grep -oE '<link>[^<]+/posts/[^<]+</link>' | head -1 | sed -E 's#</?link>##g')
          [ -n "$newest" ] || { echo "no post found in the feed"; exit 1; }
          check_page "$newest"
          curl -fsSL --retry 3 -o /dev/null "$base/sitemap.xml"
          echo "live smoke test passed"


