name: Publish new posts to Nostr

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new or modified posts
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'content/posts/**' | grep '\.md$' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed: $FILES"

      - name: Setup Node.js
        if: steps.changed.outputs.files != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changed.outputs.files != ''
        run: npm ci

      - name: Publish to Nostr
        if: steps.changed.outputs.files != ''
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          SITE_BASE_URL:     ${{ secrets.SITE_BASE_URL }}
          NOSTR_RELAYS:      ${{ secrets.NOSTR_RELAYS }}
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            echo "Publishing $f…"
            node .github/scripts/publish-to-nostr.mjs "$f"
          done
